<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>OUR World</title>
        <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        header {
            text-align: center;
            padding: 10px 0 20px;
        }

        h1 {
            color: #d81b60;
            margin-bottom: 5px;
        }

        .gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .caption {
            padding: 12px;
            margin: 0;
            font-weight: bold;
            color: #444;
        }
    </style>
    </head>
    <body>
         <header> <h1>our world</h1> 
       <p>A small collection of our favorite memories</p>
       </header>
      
       <div class="gallery">
       <div class="card">
           <img src="3.jpg" alt="our picture">
           <p class="caption">special moment</p>
           </div>
           <div class="card">
               <img src="2.jpg" alt="our picture">
               <p class="caption">special moment</p>
               </div>
               <div class="card">
               <img src="1.jpg" alt="our picture">
  <p class="caption">anathor great moment</p>
               </div>
               </div>
    </body>
</html>
