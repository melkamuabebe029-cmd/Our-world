<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OUR World</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        header {
            text-align: center;
            padding: 10px 0 20px;
        }

        h1 {
            color: #d81b60;
            margin-bottom: 5px;
        }

        .gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .card img {
            width: 100%;
            height: auto;
            display: block;
            cursor: pointer;
        }

        .caption {
            padding: 12px;
            margin: 0;
            font-weight: bold;
            color: #444;
        }

        /* Floating Music Button */
        .music-btn {
            position: fixed;
            bottom: 25px;
            right: 20px;
            z-index: 999;
            background-color: #d81b60;
            color: #ffffff;
            border: none;
            padding: 12px 18px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(216, 27, 96, 0.4);
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .music-btn:active {
            transform: scale(0.95);
        }

        /* Full Screen Overlay with Smooth Transition */
        .modal {
            display: flex;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-in-out;
        }

        .modal-content {
            max-width: 90%;
            max-height: 85%;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            transform: scale(0.8);
            transition: transform 0.3s ease-in-out;
        }

        .modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #ffffff;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Background Audio File -->
    <audio id="bgMusic" loop src="music.mp3"></audio>

    <!-- Floating Play/Pause Button -->
    <button id="musicBtn" class="music-btn" onclick="toggleMusic()">🎵 Play Music</button>

    <header>
        <h1>our world</h1>
        <p>A small collection of our favorite memories</p>
    </header>

    <div class="gallery">
        <div class="card">
            <img src="1.jpg" alt="our picture" onclick="openModal(this.src)">
            <p class="caption">special moment</p>
        </div>

        <div class="card">
            <img src="2.jpg" alt="our picture" onclick="openModal(this.src)">
            <p class="caption">special moment</p>
        </div>

        <div class="card">
            <img src="3.jpg" alt="our picture" onclick="openModal(this.src)">
            <p class="caption">another great moment</p>
        </div>
    </div>

    <!-- Full Screen Popup Modal -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-btn">&times;</span>
        <img class="modal-content" id="fullImage">
    </div>

    <script>
        function openModal(imageSrc) {
            var modal = document.getElementById("imageModal");
            var modalImg = document.getElementById("fullImage");
            
            modalImg.src = imageSrc;
            modal.classList.add("show");
        }

        function closeModal() {
            var modal = document.getElementById("imageModal");
            modal.classList.remove("show");
        }

        function toggleMusic() {
            var audio = document.getElementById("bgMusic");
            var btn = document.getElementById("musicBtn");

            if (audio.paused) {
                audio.play();
                btn.innerHTML = "⏸️ Pause Music";
                btn.style.backgroundColor = "#333333";
            } else {
                audio.pause();
                btn.innerHTML = "🎵 Play Music";
                btn.style.backgroundColor = "#d81b60";
            }
        }
    </script>

</body>
</html>
