<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OUR World</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        header {
            text-align: center;
            padding: 10px 0 20px;
        }

        h1 {
            color: #d81b60;
            margin-bottom: 5px;
        }

        .gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .card img {
            width: 100%;
            height: auto;
            display: block;
            cursor: pointer;
        }

        .caption {
            padding: 12px;
            margin: 0;
            font-weight: bold;
            color: #444;
        }

        /* Full Screen Overlay */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 90%;
            max-height: 85%;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #ffffff;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>our world</h1>
        <p>A small collection of our favorite memories</p>
    </header>

    <div class="gallery">
        <div class="card">
            <img src="1.jpg" alt="our picture" onclick="openModal(this.src)">
            <p class="caption">special moment</p>
        </div>

        <div class="card">
            <img src="2.jpg" alt="our picture" onclick="openModal(this.src)">
            <p class="caption">special moment</p>
        </div>

        <div class="card">
            <img src="3.jpg" alt="our picture" onclick="openModal(this.src)">
            <p class="caption">another great moment</p>
        </div>
    </div>

    <!-- Full Screen Popup Modal -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-btn">&times;</span>
        <img class="modal-content" id="fullImage">
    </div>

    <script>
        function openModal(imageSrc) {
            var modal = document.getElementById("imageModal");
            var modalImg = document.getElementById("fullImage");
            modal.style.display = "flex";
            modalImg.src = imageSrc;
        }

        function closeModal() {
            document.getElementById("imageModal").style.display = "none";
        }
    </script>

</body>
</html>
